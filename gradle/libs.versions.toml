[versions]
ignition = "8.3.0"
gson = "2.14.0"
jakarta-servlet = "6.0.0"
# slf4j-api: pinned to what the Designer scope's classpath actually bundles (the bare
# slf4j-api-2.0.12.jar in lib/core/common/ — lib/core/designer/ has no slf4j-api jar of
# its own, so common's copy is the only one reachable; verified 30/07/2026 dependency
# audit by unzipping the jar and reading its manifest Implementation-Version directly).
# slf4j is a logging *facade* whose ServiceLoader binding must match the platform's own
# logging backend, so — unlike Gson — it cannot simply be shipped at a newer version;
# treat it like jakarta.servlet: compileOnly, never exceed the platform's bundled copy.
slf4j-designer-api = "2.0.12"
# slf4j (test/shipped-only uses, e.g. slf4j-simple as a standalone test harness backend):
# free to track latest stable, unrelated to the compileOnly pin above.
slf4j = "2.0.18"
commons-compress = "1.28.0"
junit-jupiter = "5.14.4"
junit-platform-launcher = "1.14.4"
mockito = "5.23.0"
assertj = "3.27.7"
awaitility = "4.2.2"
rsyntaxtextarea = "4.0.1"
autocomplete = "3.3.3"
rstaui = "3.3.2"
# flatlaf REMOVED 30/07/2026 — dead dependency (zero usage anywhere in the module; its
# only consumer, FlatLafScope, was deleted in v4.3.2/v4.3.3). See designer/build.gradle.kts.

[libraries]
ignition-common = { module = "com.inductiveautomation.ignitionsdk:ignition-common", version.ref = "ignition" }
ignition-gateway-api = { module = "com.inductiveautomation.ignitionsdk:gateway-api", version.ref = "ignition" }
ignition-designer-api = { module = "com.inductiveautomation.ignitionsdk:designer-api", version.ref = "ignition" }
ignition-perspective-gateway = { module = "com.inductiveautomation.ignitionsdk:perspective-gateway", version.ref = "ignition" }
ignition-perspective-common = { module = "com.inductiveautomation.ignitionsdk:perspective-common", version.ref = "ignition" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jakarta-servlet = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "jakarta-servlet" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j-designer-api" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
rsyntaxtextarea = { module = "com.fifesoft:rsyntaxtextarea", version.ref = "rsyntaxtextarea" }
autocomplete = { module = "com.fifesoft:autocomplete", version.ref = "autocomplete" }
rstaui = { module = "com.fifesoft:rstaui", version.ref = "rstaui" }
