# Python 3 Integration Scripting Functions Documentation
# Used by Ignition Designer for scripting function tooltips and autocomplete help.
#
# Format: functionName.desc, functionName.param.paramName, functionName.returns
# For overloads with the same name, the last definition wins - describe the full overload set.
#
# Quick reference - choosing the right function:
#   exec()       - Run statements, multi-line code, imports, assign variables
#   eval()       - Evaluate a single expression and get the result back
#   callModule() - Call one function from a Python module (math.sqrt, json.dumps, etc.)
#   callScript() - Run a saved script from the Gateway script repository
#   isAvailable() / getVersion() / getPoolStats() - Health checks and monitoring
#   getAvailableScripts() - Discover saved scripts
#   getDistributionInfo() - Python installation details (paths, versions, venv status)
#   example()    - Quick smoke test

# =============================================================================
# system.python3.exec  - Execute Python 3 code statements
# =============================================================================
exec.desc=Execute one or more Python 3 statements on the Gateway and optionally return a value.\n\n\
  WHEN TO USE: Use exec() when you need to run statements (assignments, imports, loops, \
  if/else, try/except, or multi-line code). This is the most versatile function.\n\
  For a single expression that returns a value, use eval() instead - it is simpler.\n\n\
  RETURNING A VALUE: Assign to a variable named 'result' - that value is returned to Jython.\n\
  If you don't set 'result', a dict of all local variables is returned.\n\n\
  Examples:\n\
    # Basic execution\n\
    system.python3.exec("print('hello')")\n\n\
    # Return a computed value\n\
    val = system.python3.exec("result = 2 + 2")  # val = 4\n\n\
    # Pass variables from Jython into Python\n\
    val = system.python3.exec("result = x * y", {"x": 10, "y": 5})  # val = 50\n\n\
    # Multi-line: use \\n for newlines\n\
    code = "import math\\nresult = math.pi * radius**2"\n\
    area = system.python3.exec(code, {"radius": 5.0})  # area = 78.54...\n\n\
    # Process Ignition tag values with pandas\n\
    code = "import pandas as pd\\ndf = pd.DataFrame(rows)\\nresult = df.describe().to_dict()"\n\
    stats = system.python3.exec(code, {"rows": tagData})\n\n\
    # Date math (Python 3 datetime is more powerful than Jython's)\n\
    code = "from datetime import datetime, timedelta\\n"\n\
    code += "dt = datetime.strptime(dateStr, '%Y-%m-%d')\\n"\n\
    code += "result = (dt + timedelta(days=30)).strftime('%Y-%m-%d')"\n\
    futureDate = system.python3.exec(code, {"dateStr": "2026-01-15"})\n\n\
  Common mistakes:\n\
  - Forgetting 'result =': exec("2 + 2") returns {} (empty locals), not 4\n\
  - Use exec("result = 2 + 2") to get 4 back\n\
  - Trying 'import math' in eval() - imports are statements, use exec()

exec.param.code=String - Python 3 code to execute. Can be a single statement or multiple \
  statements separated by \\n (newline). Assign to 'result' to return a value.\n\
  Single statement: "result = len(items)"\n\
  Multi-line: "import json\\ndata = json.loads(text)\\nresult = data['key']"\n\
  With loops: "total = 0\\nfor x in items:\\n    total += x\\nresult = total"

exec.param.variables=Dict (optional) - A dictionary of variables to inject into the Python scope. \
  Keys become Python variable names; values are converted automatically.\n\
  Supported types: String, int, float, bool, list, dict, None.\n\
  Example: {"radius": 5.0, "name": "Alice", "items": [1, 2, 3], "config": {"debug": True}}

exec.returns=The value of the 'result' variable if set in the code. Type depends on what Python \
  produces (int, float, str, list, dict, bool, or None). If 'result' is not set, returns a dict \
  of all local variables created during execution. Complex Python objects (classes, functions) are \
  converted to their string representation.\n\
  Throws RuntimeException if Python raises an error - the message includes the Python traceback.

# =============================================================================
# system.python3.eval  - Evaluate a single Python 3 expression
# =============================================================================
eval.desc=Evaluate a single Python 3 expression and return its value directly.\n\n\
  WHEN TO USE: Use eval() for quick, one-line expressions where you just want the answer back. \
  No need to assign to 'result' - the expression's value is returned automatically.\n\
  Rule of thumb: if you can type it after '>>> ' in a Python shell, it works in eval().\n\n\
  eval() CANNOT run statements. These will fail: import, for, if, def, class, assignment (=). \
  For any of those, use exec() instead.\n\n\
  Examples:\n\
    # Arithmetic\n\
    system.python3.eval("2 + 2")  # returns 4 (Integer)\n\
    system.python3.eval("3.14 * r**2", {"r": 5})  # returns 78.5 (Float)\n\n\
    # String operations\n\
    system.python3.eval("name.upper()", {"name": "hello"})  # returns "HELLO"\n\
    system.python3.eval("','.join(items)", {"items": ["a","b","c"]})  # returns "a,b,c"\n\n\
    # List/dict operations\n\
    system.python3.eval("len(data)", {"data": [1,2,3,4,5]})  # returns 5\n\
    system.python3.eval("sorted(scores)", {"scores": [88,72,95,61]})  # returns [61,72,88,95]\n\
    system.python3.eval("[x**2 for x in range(6)]")  # returns [0,1,4,9,16,25]\n\
    system.python3.eval("max(temps)", {"temps": [72.1, 68.5, 85.3]})  # returns 85.3\n\n\
    # Boolean checks\n\
    system.python3.eval("value > threshold", {"value": 95.2, "threshold": 90.0})  # True\n\n\
  What WON'T work (use exec() instead):\n\
    system.python3.eval("import math")       # ERROR: import is a statement\n\
    system.python3.eval("x = 5")             # ERROR: assignment is a statement\n\
    system.python3.eval("for i in range(3): print(i)")  # ERROR: for is a statement

eval.param.expression=String - A single Python 3 expression to evaluate. Must produce a value. \
  Cannot contain statements (import, for, if, def, class, assignments).\n\
  Valid: "x + y", "len(data)", "[i*2 for i in items]", "'hello'.upper()", "x > 10"\n\
  Invalid: "import math", "x = 5", "for i in range(3): print(i)"

eval.param.variables=Dict (optional) - Variables available in the expression scope. \
  Keys become Python variable names; values are converted automatically.\n\
  Example: {"x": 10, "y": 20} lets you write eval("x + y", {"x": 10, "y": 20})

eval.returns=The direct result of the expression. The Jython type depends on the Python type:\n\
  Python int -> Java Integer or Long\n\
  Python float -> Java Double\n\
  Python str -> Java String\n\
  Python list -> Java ArrayList\n\
  Python dict -> Java HashMap\n\
  Python bool -> Java Boolean\n\
  Python None -> Java null\n\
  Throws RuntimeException if the expression is invalid or raises a Python error.

# =============================================================================
# system.python3.callModule  - Call a function from a Python module directly
# =============================================================================
callModule.desc=Call a specific function from any Python 3 module (standard library or pip-installed). \
  This is a shortcut that avoids writing boilerplate exec() code for simple function calls.\n\n\
  WHEN TO USE: Use callModule() when you want to call exactly one function from a module \
  and get the result back. It handles the import for you.\n\
  For complex workflows (multiple calls, intermediate variables), use exec() instead.\n\n\
  Examples:\n\
    # Standard library\n\
    system.python3.callModule("math", "sqrt", [16])           # 4.0\n\
    system.python3.callModule("math", "factorial", [10])       # 3628800\n\
    system.python3.callModule("random", "randint", [1, 100])   # random int 1-100\n\
    system.python3.callModule("os.path", "exists", ["/etc/hosts"])  # True/False\n\n\
    # JSON processing\n\
    jsonStr = system.python3.callModule("json", "dumps", [myDict], {"indent": 2})\n\
    parsed = system.python3.callModule("json", "loads", [jsonStr])\n\n\
    # Date/time\n\
    system.python3.callModule("time", "strftime", ["%Y-%m-%d %H:%M:%S"])\n\n\
    # Pip-installed packages (install via Packages button or Gateway Web UI)\n\
    system.python3.callModule("hashlib", "md5", [b"data"]).hexdigest()  # won't work - use exec()\n\
    # For chained calls like .hexdigest(), use exec() instead:\n\
    # system.python3.exec("import hashlib\\nresult = hashlib.md5(data).hexdigest()", {"data": b"test"})\n\n\
  Note: The module must be importable in the Gateway's Python environment. \
  If you get "ModuleNotFoundError", install the package first via the IDE Packages button \
  or the Gateway Web UI.

callModule.param.moduleName=String - The Python module to import. Use dot notation for submodules.\n\
  Standard library: "math", "json", "os.path", "datetime", "re", "hashlib", "base64", "csv"\n\
  Pip packages: "numpy", "pandas", "requests" (must be installed first)

callModule.param.functionName=String - The function to call within the module.\n\
  Examples: "sqrt" (in math), "dumps" (in json), "exists" (in os.path), "compile" (in re)

callModule.param.args=List - Positional arguments to pass to the function. \
  Use an empty list [] if the function takes no arguments.\n\
  Examples: [16] for sqrt(16), [1, 100] for randint(1, 100), [myDict] for dumps(myDict)

callModule.param.kwargs=Dict (optional) - Keyword arguments to pass to the function.\n\
  Example: {"indent": 2} for json.dumps(obj, indent=2)\n\
  Example: {"encoding": "utf-8"} for open(path, encoding="utf-8")

callModule.returns=The return value of the function call. Type depends on the function called - \
  see eval().returns for the Python-to-Java type mapping.\n\
  Throws RuntimeException if the module cannot be imported, the function does not exist, \
  or the function raises an exception.

# =============================================================================
# system.python3.callScript  - Execute a saved script by name
# =============================================================================
callScript.desc=Execute a previously saved Python 3 script by its name or folder path. \
  Scripts are created and saved in the Python 3 IDE (Designer) or Gateway Web UI.\n\n\
  WHEN TO USE: Use callScript() to run reusable Python scripts that are stored in the Gateway. \
  This lets you write and test code in the IDE, then call it from Ignition event scripts, \
  Vision windows, Perspective views, or other scripting contexts.\n\n\
  PASSING DATA: You can pass arguments into the script. Inside the script, access them as \
  'args' (list of positional args) and 'kwargs' (dict of keyword args).\n\n\
  GETTING RESULTS: Set a variable named 'result' in the script - that value is returned.\n\n\
  Examples:\n\
    # Run a simple script (no arguments)\n\
    val = system.python3.callScript("Daily Report")\n\n\
    # Run a script in a folder\n\
    val = system.python3.callScript("Reports/Daily Summary")\n\n\
    # Pass positional arguments\n\
    val = system.python3.callScript("Process Data", [tagValue1, tagValue2])\n\n\
    # Pass keyword arguments\n\
    tax = system.python3.callScript("Calc Tax", [], {"rate": 0.08, "amount": 100.00})\n\n\
    # In the called script, access arguments like this:\n\
    #   item = args[0]         # first positional argument\n\
    #   rate = kwargs["rate"]  # keyword argument\n\
    #   result = item * rate   # this value is returned to the caller\n\n\
  Tip: Use system.python3.getAvailableScripts() to list all saved scripts and their paths.

callScript.param.scriptPath=String - Name of the saved script, or "Folder/Name" for scripts in folders. \
  Case-sensitive. Use forward slashes for folder paths.\n\
  Examples: "My Script", "Utilities/Format Date", "Reports/Daily Summary"

callScript.param.args=List (optional) - Positional arguments passed to the script. \
  Available inside the script as the 'args' variable (a list).\n\
  Example: [42, "hello", True] -> script accesses as args[0], args[1], args[2]

callScript.param.kwargs=Dict (optional) - Keyword arguments passed to the script. \
  Available inside the script as the 'kwargs' variable (a dict).\n\
  Example: {"temperature": 98.6, "unit": "F"} -> script accesses as kwargs["temperature"]

callScript.returns=The value of the 'result' variable set inside the script, or None \
  if the script did not set a result variable. See eval().returns for type mapping.\n\
  Throws RuntimeException if the script is not found in the repository, \
  or if the script raises a Python error (message includes the traceback).

# =============================================================================
# system.python3.isAvailable  - Check if Python 3 is ready
# =============================================================================
isAvailable.desc=Check whether the Python 3 process pool is initialized and healthy.\n\n\
  WHEN TO USE: Call this before exec/eval in scripts where Python 3 might not be available \
  (module not installed, pool not started, Gateway restarting). This avoids RuntimeExceptions \
  in production code.\n\n\
  Example:\n\
    if system.python3.isAvailable():\n\
        result = system.python3.eval("2 + 2")\n\
    else:\n\
        logger.warn("Python 3 is not available")\n\n\
  In a Perspective view:\n\
    if system.python3.isAvailable():\n\
        self.getSibling("Label").props.text = system.python3.eval("'hello'.upper()")\n\
    else:\n\
        self.getSibling("Label").props.text = "Python 3 unavailable"

isAvailable.returns=Boolean - True if the process pool is initialized, running, and not shut down. \
  False if the pool was never started, has been shut down, or the module is not loaded. \
  This call is lightweight and does not execute any Python code.

# =============================================================================
# system.python3.getVersion  - Get Python version information
# =============================================================================
getVersion.desc=Returns information about the Python 3 installation running on the Gateway.\n\n\
  WHEN TO USE: Use this to display the Python version in a UI, check compatibility, or \
  verify that the correct Python is being used (e.g., 3.11 vs 3.12).\n\n\
  Example:\n\
    info = system.python3.getVersion()\n\
    if info["available"]:\n\
        print("Python " + info["version"])  # e.g. "Python 3.11.5 (main, Sep 11 2023, ...)"\n\
    else:\n\
        print("Python 3 not available: " + str(info.get("error", "unknown")))\n\n\
  Note: This actually runs 'import sys; sys.version' in a subprocess, so it confirms \
  the pool is working, not just initialized.

getVersion.returns=Dict with keys:\n\
  "version" (String) - Full Python version string, e.g. "3.11.5 (main, Sep 11 2023, 08:31:25)"\n\
  "available" (Boolean) - True if Python is running, False if not\n\
  "error" (String) - Only present when available=False, describes what went wrong.\n\
  Example success: {"version": "3.11.5 (main, ...)", "available": True}\n\
  Example failure: {"available": False, "error": "Python 3 process pool is not initialized"}

# =============================================================================
# system.python3.getPoolStats  - Get process pool statistics
# =============================================================================
getPoolStats.desc=Returns runtime statistics about the Python 3 subprocess pool. \
  Useful for monitoring, dashboards, and diagnosing performance issues.\n\n\
  WHEN TO USE: Call this to check how busy the pool is - if 'available' is 0 and 'inUse' \
  equals 'poolSize', your scripts may be waiting for a free worker. Consider increasing \
  the pool size via Gateway system property: -Dignition.python3.poolsize=5\n\n\
  Example:\n\
    stats = system.python3.getPoolStats()\n\
    print("Workers: %d total, %d available, %d in use, %d healthy" % (\n\
        stats["poolSize"], stats["available"], stats["inUse"], stats["healthy"]))\n\n\
  In a Perspective dashboard:\n\
    stats = system.python3.getPoolStats()\n\
    if stats.get("available", 0) == 0:\n\
        # All workers busy - scripts may be queuing\n\
        self.getSibling("StatusLabel").props.text = "Pool exhausted!"\n\n\
  Key metrics:\n\
  - poolSize: Total number of Python subprocess workers (default: 3, max: 20)\n\
  - available: Workers currently idle and ready for work\n\
  - inUse: Workers currently executing Python code\n\
  - healthy: Workers that responded to the last health check (runs every 30s)

getPoolStats.returns=Dict with integer values:\n\
  "poolSize" (int) - Total worker processes (e.g. 3)\n\
  "available" (int) - Idle workers ready for requests\n\
  "inUse" (int) - Workers currently running code\n\
  "healthy" (int) - Workers that passed the last health check\n\
  Example: {"poolSize": 3, "available": 2, "inUse": 1, "healthy": 3}\n\
  Returns {"error": "message"} if the pool is not initialized.

# =============================================================================
# system.python3.getAvailableScripts  - List all saved scripts
# =============================================================================
getAvailableScripts.desc=Returns a list of all saved Python 3 scripts with their metadata. \
  Scripts are saved from the Python 3 IDE (Designer) or the Gateway Web UI.\n\n\
  WHEN TO USE: Use this to discover available scripts before calling them with callScript(), \
  or to build dynamic script selectors in Perspective/Vision.\n\n\
  Example:\n\
    scripts = system.python3.getAvailableScripts()\n\
    for s in scripts:\n\
        print(s["path"] + " - " + s["description"])\n\n\
  Build a dropdown of script names:\n\
    scripts = system.python3.getAvailableScripts()\n\
    options = [{"label": s["name"], "value": s["path"]} for s in scripts]\n\n\
  Call the first available script:\n\
    scripts = system.python3.getAvailableScripts()\n\
    if scripts:\n\
        result = system.python3.callScript(scripts[0]["path"])

getAvailableScripts.returns=List of Dicts, each containing:\n\
  "name" (String) - Script display name, e.g. "Daily Report"\n\
  "path" (String) - Full path including folder, e.g. "Reports/Daily Report"\n\
  "description" (String) - Script description (empty string if not set)\n\
  "author" (String) - Script author (empty string if not set)\n\
  "version" (String) - Script version (defaults to "1.0")\n\
  "lastModified" (String) - Last modification timestamp\n\
  Returns an empty list if no scripts are saved or the repository is not initialized.

# =============================================================================
# system.python3.getDistributionInfo  - Get Python distribution and installation details
# =============================================================================
getDistributionInfo.desc=Returns detailed information about the Python 3 installation on the Gateway, \
  including paths, installed versions, virtual environment status, and download availability.\n\n\
  WHEN TO USE: Use this for diagnostics and troubleshooting when Python scripts fail, \
  or to display installation details in an admin dashboard. This tells you WHERE Python is \
  installed, WHICH versions are available, and whether a virtual environment is active.\n\n\
  Example:\n\
    info = system.python3.getDistributionInfo()\n\
    if info.get("available"):\n\
        print("Python path: " + info["pythonPath"])\n\
        print("OS: " + info["os"])\n\
        print("Installed versions: " + str(info["installedVersions"]))\n\
        if info.get("usingVenv"):\n\
            print("Virtual env: " + info["venvPath"])\n\
    else:\n\
        print("Python not available: " + info.get("error", "unknown"))\n\n\
  Check if embedded Python is installed:\n\
    info = system.python3.getDistributionInfo()\n\
    if not info.get("embeddedInstalled", False):\n\
        print("No embedded Python - using system Python at: " + info.get("pythonPath", "?"))

getDistributionInfo.returns=Dict with keys:\n\
  "available" (Boolean) - True if a Python executable was found\n\
  "os" (String) - Operating system: "linux", "windows", or "macos"\n\
  "pythonPath" (String) - Absolute path to the Python executable being used\n\
  "pythonDir" (String) - Directory where Python installations are stored\n\
  "distributionsDir" (String) - Directory for downloadable Python distributions\n\
  "embeddedInstalled" (Boolean) - True if an embedded Python is installed in the module directory\n\
  "autoDownload" (Boolean) - True if auto-download of Python distributions is enabled\n\
  "installedVersions" (List) - List of installed Python version strings, e.g. ["3.11", "3.12"]\n\
  "availableVersions" (List) - List of versions available for download\n\
  "usingVenv" (Boolean) - True if a virtual environment is active\n\
  "venvPath" (String) - Path to the active virtual environment (only present if usingVenv=True)\n\
  "error" (String) - Error message (only present when available=False)\n\
  Returns {"available": False, "error": "..."} if the distribution manager is not initialized.

# =============================================================================
# system.python3.example  - Quick test function
# =============================================================================
example.desc=Runs a quick smoke test to verify that Python 3 is working correctly. \
  Calculates 2^100 using eval() and returns a confirmation string.\n\n\
  WHEN TO USE: Use this right after installing or restarting the module to verify \
  connectivity between the Gateway and the Python subprocess pool.\n\n\
  Example:\n\
    result = system.python3.example()\n\
    print(result)  # "Python 3 is working! 2^100 = 1267650600228229401496703205376"\n\n\
  If it returns "Python 3 error: ...", check:\n\
  - Is Python 3 installed on the Gateway server?\n\
  - Is the python3 path configured correctly? (Check Gateway logs)\n\
  - Are there firewall rules blocking subprocess creation?

example.returns=String - On success: "Python 3 is working! 2^100 = 1267650600228229401496703205376"\n\
  On failure: "Python 3 error: <error message describing what went wrong>"
