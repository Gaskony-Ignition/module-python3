<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python 3 IDE - Ignition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; }
    body { background: #11111b; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React UMD libraries (copied during build) -->
  <script src="/res/python3integration/react.production.min.js"></script>
  <script src="/res/python3integration/react-dom.production.min.js"></script>

  <!-- Bridge React globals for UMD module -->
  <script>
    window.react = window.React;
    window["react-dom"] = window.ReactDOM;
  </script>

  <!-- Python 3 IDE UMD module -->
  <script src="/res/python3integration/Python3IDE.js"></script>

  <!-- Mount React app -->
  <script>
    ReactDOM.createRoot(document.getElementById('root'))
      .render(React.createElement(Python3IDE.Python3IDE));
  </script>
</body>
</html>
